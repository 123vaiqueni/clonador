<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Clonador</title>
  <meta name="theme-color" content="#e8590c">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="marca"><img src="/icon.svg" alt=""> <div>Clonador<div class="sub">Minerar → clonar → modelar</div></div></div>
      <button class="link" id="sair" title="Sair">Sair</button>
    </header>

    <form class="caixa" id="form">
      <div class="linha-url">
        <input type="url" id="url" placeholder="Cola aqui o link da oferta (https://…)" required autocomplete="off">
        <button class="principal" id="botao" type="submit">Clonar</button>
      </div>
      <div class="opcoes">
        <span class="seg" title="Como a página é aberta ao clonar">
          <label><input type="radio" name="formato" value="telemovel" checked><span>📱 Telemóvel</span></label>
          <label><input type="radio" name="formato" value="computador"><span>💻 Computador</span></label>
        </span>
        <span class="seg" title="Com movimento: animações, sliders e contadores funcionam (sem os pixels deles). Estática: uma fotografia fiel, sem scripts.">
          <label><input type="radio" name="modo" value="movimento" checked><span>✨ Com movimento</span></label>
          <label><input type="radio" name="modo" value="estatica"><span>📷 Estática</span></label>
          <label title="Responde ao quiz sozinho, do primeiro passo até à oferta, e guarda cada ecrã para editares."><input type="radio" name="modo" value="quiz"><span>🧩 Quiz completo</span></label>
        </span>
        <label title="Tira janelas de cookies, newsletter e escolha de país que ficariam presas na cópia.">
          <input type="checkbox" id="popups" checked> Tirar popups
        </label>
      </div>
      <div class="estado" id="estado"></div>
    </form>

    <div class="bb-topo">
      <h2 id="titulo-lista">Biblioteca</h2>
      <div class="bb-filtros">
        <input id="bb-procurar" type="search" placeholder="Procurar (nome, nicho, etiqueta, notas)…" autocomplete="off">
        <select id="bb-nicho"><option value="">Todos os nichos</option></select>
        <label class="bb-fav"><input type="checkbox" id="bb-fav"> ⭐</label>
      </div>
    </div>
    <div class="grelha" id="lista"></div>
  </div>

  <dialog id="dlg-estudo">
    <div class="dlg-topo">
      <strong>Estudo da página</strong>
      <button class="link" data-fechar aria-label="Fechar">✕</button>
    </div>
    <div class="dlg-sub" id="es-origem"></div>
    <h3>Nome</h3>
    <input id="es-titulo" class="pb-campo" autocomplete="off">
    <h3>Nicho</h3>
    <input id="es-nicho" class="pb-campo" list="nichos" placeholder="ex.: emagrecimento, receitas, renda extra" autocomplete="off">
    <datalist id="nichos"></datalist>
    <h3>Etiquetas</h3>
    <input id="es-etiquetas" class="pb-campo" placeholder="ex.: quiz, vsl, low ticket, escala (separadas por vírgulas)" autocomplete="off">
    <h3>Notas de estudo</h3>
    <textarea id="es-notas" class="pb-campo" rows="9" placeholder="Promessa principal:&#10;Mecanismo:&#10;Oferta e preço (âncora):&#10;Bónus:&#10;Garantia:&#10;Provas sociais:&#10;Estágio de sofisticação (E1–E5):&#10;O que vou modelar:"></textarea>
    <label class="es-fav"><input type="checkbox" id="es-fav"> ⭐ Favorita (referência forte)</label>
    <div class="dlg-rodape">
      <div class="estado" id="es-estado"></div>
      <button class="principal" id="es-guardar" type="button">Guardar</button>
    </div>
  </dialog>

  <dialog id="dlg-publicar">
    <div class="dlg-topo">
      <strong>Publicar</strong>
      <button class="link" data-fechar aria-label="Fechar">✕</button>
    </div>
    <div class="dlg-sub" id="pb-titulo"></div>

    <h3>1 · Link curto neste servidor</h3>
    <div class="pb-linha">
      <span class="pb-prefixo" id="pb-origem"></span>
      <input id="pb-slug" placeholder="nome-da-oferta" autocomplete="off">
    </div>

    <h3>2 · Domínio próprio</h3>
    <input id="pb-dominio" class="pb-campo" placeholder="minhaoferta.com (vazio = nenhum)" autocomplete="off">
    <div class="pb-ajuda" id="pb-ajuda-dominio"></div>

    <div class="dlg-rodape">
      <div class="estado" id="pb-estado"></div>
      <button class="principal" id="pb-guardar" type="button">Guardar</button>
    </div>

    <h3>3 · Domínio grátis (Netlify)</h3>
    <div class="pb-linha">
      <input id="pb-netlify" placeholder="nome-da-oferta" autocomplete="off">
      <span class="pb-prefixo">.netlify.app</span>
      <button id="pb-netlify-publicar" type="button">Publicar</button>
    </div>
    <div class="pb-ajuda" id="pb-netlify-info"></div>
  </dialog>

  <script>
    const $ = (s) => document.querySelector(s);
    const estado = $('#estado');

    function mostrar(msg, tipo = '') {
      estado.className = 'estado ' + tipo;
      estado.innerHTML = msg;
    }

    async function api(caminho, opts = {}) {
      const r = await fetch(caminho, { headers: { 'content-type': 'application/json' }, ...opts });
      if (r.status === 401) { location.href = '/login'; throw new Error('sessão'); }
      const dados = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(dados.erro || 'Algo correu mal.');
      return dados;
    }

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const tamanho = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.round(b / 1024) + ' KB';
    // O melhor endereço público da página: domínio próprio > Netlify > link curto > /p/id.
    const urlPublica = (c) => c.dominios?.length ? `https://${c.dominios[0]}/`
      : c.netlify?.url ? c.netlify.url
      : c.slug ? `${location.origin}/${c.slug}/` : `${location.origin}/p/${c.id}/`;
    const publicadoEm = (c) => {
      const onde = [...(c.dominios || []), c.netlify?.url?.replace(/^https?:\/\//, ''), c.slug ? `/${c.slug}` : ''].filter(Boolean);
      return onde.length ? `<div class="publicado">🌐 ${onde.map(esc).join(' · ')}</div>` : '';
    };
    let config = { netlify: false, ipServidor: '' };
    fetch('/api/config').then((r) => r.json()).then((c) => { config = c; }).catch(() => {});

    let ultimaLista = [];
    async function carregar() {
      ultimaLista = await api('/api/clones');
      desenharNichos(ultimaLista);
      desenhar(ultimaLista);
    }
    function desenhar(todas) {
      const lista = filtrar(todas);
      $('#titulo-lista').textContent = `Biblioteca (${lista.length === todas.length ? todas.length : `${lista.length} de ${todas.length}`})`;
      if (!todas.length) {
        $('#lista').innerHTML = '<div class="vazio" style="grid-column:1/-1">Ainda não clonaste nenhuma página. Cola um link em cima.</div>';
        return;
      }
      if (!lista.length) {
        $('#lista').innerHTML = '<div class="vazio" style="grid-column:1/-1">Nada com esse filtro.</div>';
        return;
      }
      $('#lista').innerHTML = lista.map((c) => `
        <div class="clone">
          <a class="thumb" href="/p/${c.id}/" target="_blank" style="background-image:url('/p/${c.id}/thumb.jpg')"></a>
          <div class="corpo">
            <div class="titulo"><button class="link fav ${c.favorito ? 'on' : ''}" data-fav="${c.id}" title="Favorita">${c.favorito ? '★' : '☆'}</button>${esc(c.titulo)}</div>
            <div class="origem" title="${esc(c.url)}">${esc(new URL(c.url).hostname)} · ${c.formato === 'computador' ? '💻' : '📱'} · ${c.modo === 'estatica' ? '📷' : c.modo === 'quiz' ? `🧩 ${c.quiz?.passos?.length || ''} passos` : c.spa ? '⚛️' : '✨'} · ${tamanho(c.bytes)}${c.editadoEm ? ' · ✏️ editada' : ''}</div>
            ${c.nicho || c.etiquetas?.length ? `<div class="etiquetas">${c.nicho ? `<span class="nicho">${esc(c.nicho)}</span>` : ''}${(c.etiquetas || []).map((t) => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
            ${c.notas ? `<div class="notas" title="${esc(c.notas)}">📝 ${esc(c.notas.split(/\n/).find((l) => l.trim()) || '').slice(0, 90)}</div>` : ''}
            ${publicadoEm(c)}
            <div class="accoes">
              <a class="btn principal" href="/editor.html?id=${c.id}">✏️ Editar</a>
              <a class="btn" href="${urlPublica(c)}" target="_blank">Abrir</a>
              <button data-publicar="${c.id}">Publicar</button>
              <button data-estudo="${c.id}">📝 Estudo</button>
              <button data-copiar="${c.id}">Copiar link</button>
              <a class="btn" href="/api/clones/${c.id}/zip">ZIP</a>
              <button class="perigo" data-apagar="${c.id}">Apagar</button>
            </div>
          </div>
        </div>`).join('');
    }

    $('#form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const botao = $('#botao');
      botao.disabled = true;
      const inicio = Date.now();
      const modo = document.querySelector('input[name=modo]:checked').value;
      mostrar(modo === 'quiz'
        ? '<span class="giro"></span> A responder ao quiz passo a passo… (1 a 3 minutos)'
        : '<span class="giro"></span> A abrir a página e a copiar tudo… (pode levar até 1 minuto)');
      try {
        let c = await api('/api/clones', {
          method: 'POST',
          body: JSON.stringify({
            url: $('#url').value.trim(),
            formato: document.querySelector('input[name=formato]:checked').value,
            modo,
            removerPopups: $('#popups').checked,
          }),
        });
        // Quiz: corre em fundo; vamos perguntando em que passo vai.
        while (c.trabalho) {
          await new Promise((r) => setTimeout(r, 2000));
          const t = await api(`/api/trabalhos/${c.trabalho}`);
          if (t.estado === 'erro') throw new Error(t.erro);
          if (t.estado === 'pronto') c = t.meta;
          else mostrar(`<span class="giro"></span> ${esc(t.progresso)} · ${Math.round((Date.now() - inicio) / 1000)}s`);
        }
        const extra = [
          c.quiz ? `${c.quiz.passos.length} passos do quiz` : '',
          c.pixelsOriginais?.length ? `${c.pixelsOriginais.length} pixels deles removidos` : '',
        ].filter(Boolean).join(' · ');
        mostrar(`✓ Clonada em ${Math.round((Date.now() - inicio) / 1000)}s — ${c.ficheiros} ficheiros${extra ? ' · ' + extra : ''}. <a href="/p/${c.id}/" target="_blank">Abrir</a> · <a href="/editor.html?id=${c.id}">Editar</a>${c.aviso ? `<br><span class="px-aviso">${esc(c.aviso)}</span>` : ''}`, 'ok');
        $('#url').value = '';
        carregar();
      } catch (err) {
        mostrar(esc(err.message), 'erro');
      } finally {
        botao.disabled = false;
      }
    });

    $('#lista').addEventListener('click', async (e) => {
      const apagar = e.target.closest('[data-apagar]');
      const copiar = e.target.closest('[data-copiar]');
      if (apagar && confirm('Apagar esta página clonada? O link deixa de funcionar.')) {
        await api('/api/clones/' + apagar.dataset.apagar, { method: 'DELETE' });
        carregar();
      }
      if (copiar) {
        const c = (ultimaLista || []).find((x) => x.id === copiar.dataset.copiar);
        const link = c ? urlPublica(c) : `${location.origin}/p/${copiar.dataset.copiar}/`;
        try { await navigator.clipboard.writeText(link); copiar.textContent = 'Copiado ✓'; }
        catch { prompt('Copia o link:', link); }
        setTimeout(() => { copiar.textContent = 'Copiar link'; }, 1500);
      }
    });

    // ── Biblioteca: procurar, filtrar por nicho, favoritos
    function filtrar(lista) {
      const q = $('#bb-procurar').value.trim().toLowerCase();
      const nicho = $('#bb-nicho').value;
      const fav = $('#bb-fav').checked;
      return lista.filter((c) => (!nicho || c.nicho === nicho) && (!fav || c.favorito)
        && (!q || [c.titulo, c.url, c.nicho, c.notas, ...(c.etiquetas || [])].join(' ').toLowerCase().includes(q)));
    }
    function desenharNichos(lista) {
      const nichos = [...new Set(lista.map((c) => c.nicho).filter(Boolean))].sort();
      const atual = $('#bb-nicho').value;
      $('#bb-nicho').innerHTML = '<option value="">Todos os nichos</option>' + nichos.map((n) => `<option ${n === atual ? 'selected' : ''}>${esc(n)}</option>`).join('');
      $('#nichos').innerHTML = nichos.map((n) => `<option value="${esc(n)}">`).join('');
    }
    for (const el of ['#bb-procurar', '#bb-nicho', '#bb-fav']) $(el).addEventListener('input', () => desenhar(ultimaLista));

    // ── Estudo: notas da estrutura de cada página
    const dlgEstudo = $('#dlg-estudo');
    let paginaEstudo = null;
    $('#lista').addEventListener('click', (e) => {
      const b = e.target.closest('[data-estudo]');
      if (!b) return;
      paginaEstudo = ultimaLista.find((c) => c.id === b.dataset.estudo);
      if (!paginaEstudo) return;
      $('#es-titulo').value = paginaEstudo.titulo || '';
      $('#es-nicho').value = paginaEstudo.nicho || '';
      $('#es-etiquetas').value = (paginaEstudo.etiquetas || []).join(', ');
      $('#es-notas').value = paginaEstudo.notas || '';
      $('#es-fav').checked = Boolean(paginaEstudo.favorito);
      $('#es-origem').innerHTML = `<a href="${esc(paginaEstudo.url)}" target="_blank" rel="noreferrer">${esc(paginaEstudo.url)}</a>`;
      $('#es-estado').textContent = '';
      dlgEstudo.showModal();
    });
    $('#es-guardar').addEventListener('click', async () => {
      try {
        await api(`/api/clones/${paginaEstudo.id}/biblioteca`, {
          method: 'PUT',
          body: JSON.stringify({
            titulo: $('#es-titulo').value, nicho: $('#es-nicho').value, etiquetas: $('#es-etiquetas').value,
            notas: $('#es-notas').value, favorito: $('#es-fav').checked,
          }),
        });
        dlgEstudo.close();
        carregar();
      } catch (err) { $('#es-estado').className = 'estado erro'; $('#es-estado').textContent = err.message; }
    });
    $('#lista').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-fav]');
      if (!b) return;
      const c = ultimaLista.find((x) => x.id === b.dataset.fav);
      await api(`/api/clones/${c.id}/biblioteca`, { method: 'PUT', body: JSON.stringify({ favorito: !c.favorito }) });
      carregar();
    });

    // ── Publicar
    const dlgPub = $('#dlg-publicar');
    let paginaPub = null;
    function pbEstado(msg, tipo = '') { $('#pb-estado').className = 'estado ' + tipo; $('#pb-estado').textContent = msg; }

    function desenharPub() {
      const c = paginaPub;
      $('#pb-titulo').textContent = c.titulo;
      $('#pb-origem').textContent = location.host + '/';
      $('#pb-slug').value = c.slug || '';
      $('#pb-dominio').value = (c.dominios || []).join(', ');
      $('#pb-netlify').value = c.netlify?.nome || c.slug || '';
      $('#pb-ajuda-dominio').innerHTML = `No sítio onde compraste o domínio, cria um registo <b>A</b> a apontar para <code>${esc(config.ipServidor || 'o IP do servidor')}</code>.
        Depois o domínio tem de ser adicionado ao serviço do clonador no Easypanel (é aí que se liga o HTTPS).`;
      $('#pb-netlify-info').innerHTML = !config.netlify
        ? '⚠️ Ainda não ligado: falta pôr o <code>NETLIFY_TOKEN</code> no Easypanel.'
        : c.netlify?.url ? `Publicado em <a href="${esc(c.netlify.url)}" target="_blank">${esc(c.netlify.url)}</a> · carrega em Publicar de novo depois de mudares links ou pixels.`
        : 'Cria um site grátis com HTTPS em segundos.';
      $('#pb-netlify-publicar').disabled = !config.netlify;
    }

    $('#lista').addEventListener('click', (e) => {
      const b = e.target.closest('[data-publicar]');
      if (!b) return;
      paginaPub = ultimaLista.find((c) => c.id === b.dataset.publicar);
      if (!paginaPub) return;
      pbEstado('');
      desenharPub();
      dlgPub.showModal();
    });

    $('#pb-guardar').addEventListener('click', async () => {
      try {
        paginaPub = await api(`/api/clones/${paginaPub.id}/publicacao`, {
          method: 'PUT',
          body: JSON.stringify({ slug: $('#pb-slug').value, dominios: $('#pb-dominio').value.split(/[\s,]+/).filter(Boolean) }),
        });
        desenharPub();
        pbEstado(paginaPub.slug ? `✓ No ar em ${location.origin}/${paginaPub.slug}/` : '✓ Guardado.', 'ok');
        carregar();
      } catch (err) { pbEstado(err.message, 'erro'); }
    });

    $('#pb-netlify-publicar').addEventListener('click', async () => {
      const botao = $('#pb-netlify-publicar');
      botao.disabled = true;
      $('#pb-netlify-info').innerHTML = '<span class="giro"></span> A publicar na Netlify…';
      try {
        paginaPub = await api(`/api/clones/${paginaPub.id}/netlify`, { method: 'POST', body: JSON.stringify({ nome: $('#pb-netlify').value.trim().toLowerCase() }) });
        desenharPub();
        carregar();
      } catch (err) {
        $('#pb-netlify-info').innerHTML = `<span class="px-aviso">${esc(err.message)}</span>`;
      } finally {
        botao.disabled = !config.netlify;
      }
    });

    for (const d of [dlgEstudo, dlgPub]) {
      d.addEventListener('click', (e) => { if (e.target === d || e.target.closest('[data-fechar]')) d.close(); });
    }

    $('#sair').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      location.href = '/login';
    });

    // Partilhar um link para o app no telemóvel já preenche o campo.
    const partilhado = new URLSearchParams(location.search).get('url') || new URLSearchParams(location.search).get('text');
    if (partilhado) $('#url').value = (partilhado.match(/https?:\/\/\S+/) || [partilhado])[0];

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
    carregar().catch((err) => mostrar(esc(err.message), 'erro'));
  </script>
</body>
</html>
