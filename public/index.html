<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Clonador</title>
  <meta name="theme-color" content="#e8590c">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="marca"><img src="/icon.svg" alt=""> <div>Clonador<div class="sub">Minerar → clonar → modelar</div></div></div>
      <button class="link" id="sair" title="Sair">Sair</button>
    </header>

    <form class="caixa" id="form">
      <div class="linha-url">
        <input type="url" id="url" placeholder="Cola aqui o link da oferta (https://…)" required autocomplete="off">
        <button class="principal" id="botao" type="submit">Clonar</button>
      </div>
      <div class="opcoes">
        <span class="seg" title="Como a página é aberta ao clonar">
          <label><input type="radio" name="formato" value="telemovel" checked><span>📱 Telemóvel</span></label>
          <label><input type="radio" name="formato" value="computador"><span>💻 Computador</span></label>
        </span>
        <span class="seg" title="Com movimento: animações, sliders e contadores funcionam (sem os pixels deles). Estática: uma fotografia fiel, sem scripts.">
          <label><input type="radio" name="modo" value="movimento" checked><span>✨ Com movimento</span></label>
          <label><input type="radio" name="modo" value="estatica"><span>📷 Estática</span></label>
        </span>
        <label title="Tira janelas de cookies, newsletter e escolha de país que ficariam presas na cópia.">
          <input type="checkbox" id="popups" checked> Tirar popups
        </label>
      </div>
      <div class="estado" id="estado"></div>
    </form>

    <h2 id="titulo-lista">Páginas clonadas</h2>
    <div class="grelha" id="lista"></div>
  </div>

  <dialog id="dlg-links">
    <div class="dlg-topo">
      <strong>Links e checkouts</strong>
      <button class="link" data-fechar aria-label="Fechar">✕</button>
    </div>
    <div class="dlg-sub" id="ln-titulo"></div>
    <div class="ln-todos">
      <input id="ln-todos" placeholder="Colar o teu checkout para TODOS os botões de compra…" autocomplete="off">
      <button id="ln-aplicar-todos" type="button">Aplicar a todos</button>
    </div>
    <div class="ln-wa">
      <span>ou gerar link de WhatsApp:</span>
      <input id="ln-wa-numero" placeholder="923 456 789" inputmode="tel">
      <input id="ln-wa-msg" placeholder="Olá, quero o produto!" value="Olá, quero saber mais sobre o produto">
      <button id="ln-wa-gerar" type="button">Gerar</button>
    </div>
    <div id="ln-lista"></div>
    <div class="dlg-rodape">
      <div class="estado" id="ln-estado"></div>
      <button class="principal" id="ln-guardar" type="button">Guardar links</button>
    </div>
  </dialog>

  <dialog id="dlg-publicar">
    <div class="dlg-topo">
      <strong>Publicar</strong>
      <button class="link" data-fechar aria-label="Fechar">✕</button>
    </div>
    <div class="dlg-sub" id="pb-titulo"></div>

    <h3>1 · Link curto neste servidor</h3>
    <div class="pb-linha">
      <span class="pb-prefixo" id="pb-origem"></span>
      <input id="pb-slug" placeholder="nome-da-oferta" autocomplete="off">
    </div>

    <h3>2 · Domínio próprio</h3>
    <input id="pb-dominio" class="pb-campo" placeholder="minhaoferta.com (vazio = nenhum)" autocomplete="off">
    <div class="pb-ajuda" id="pb-ajuda-dominio"></div>

    <div class="dlg-rodape">
      <div class="estado" id="pb-estado"></div>
      <button class="principal" id="pb-guardar" type="button">Guardar</button>
    </div>

    <h3>3 · Domínio grátis (Netlify)</h3>
    <div class="pb-linha">
      <input id="pb-netlify" placeholder="nome-da-oferta" autocomplete="off">
      <span class="pb-prefixo">.netlify.app</span>
      <button id="pb-netlify-publicar" type="button">Publicar</button>
    </div>
    <div class="pb-ajuda" id="pb-netlify-info"></div>
  </dialog>

  <dialog id="dlg-pixels">
    <div class="dlg-topo">
      <strong>Pixels</strong>
      <button class="link" data-fechar aria-label="Fechar">✕</button>
    </div>
    <div class="dlg-sub" id="px-titulo"></div>

    <h3>Na página original</h3>
    <div id="px-originais"></div>

    <h3>Os teus pixels</h3>
    <div id="px-meus"></div>

    <form id="px-form" class="px-form">
      <select id="px-plataforma">
        <option value="meta">Meta (Facebook/Instagram)</option>
        <option value="tiktok">TikTok</option>
        <option value="google">Google Ads / Analytics</option>
        <option value="gtm">Google Tag Manager</option>
        <option value="kwai">Kwai</option>
        <option value="pinterest">Pinterest</option>
        <option value="snapchat">Snapchat</option>
        <option value="utmify">Utmify</option>
        <option value="clarity">Microsoft Clarity</option>
        <option value="personalizado">Código personalizado…</option>
      </select>
      <input id="px-id" placeholder="ID do pixel" autocomplete="off">
      <textarea id="px-codigo" rows="5" placeholder="Cola aqui o código completo (&lt;script&gt;…&lt;/script&gt;)" hidden></textarea>
      <button class="principal" type="submit">Adicionar</button>
    </form>
    <div class="estado" id="px-estado"></div>
  </dialog>

  <script>
    const $ = (s) => document.querySelector(s);
    const estado = $('#estado');

    function mostrar(msg, tipo = '') {
      estado.className = 'estado ' + tipo;
      estado.innerHTML = msg;
    }

    async function api(caminho, opts = {}) {
      const r = await fetch(caminho, { headers: { 'content-type': 'application/json' }, ...opts });
      if (r.status === 401) { location.href = '/login'; throw new Error('sessão'); }
      const dados = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(dados.erro || 'Algo correu mal.');
      return dados;
    }

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const tamanho = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.round(b / 1024) + ' KB';
    // O melhor endereço público da página: domínio próprio > Netlify > link curto > /p/id.
    const urlPublica = (c) => c.dominios?.length ? `https://${c.dominios[0]}/`
      : c.netlify?.url ? c.netlify.url
      : c.slug ? `${location.origin}/${c.slug}/` : `${location.origin}/p/${c.id}/`;
    const publicadoEm = (c) => {
      const onde = [...(c.dominios || []), c.netlify?.url?.replace(/^https?:\/\//, ''), c.slug ? `/${c.slug}` : ''].filter(Boolean);
      return onde.length ? `<div class="publicado">🌐 ${onde.map(esc).join(' · ')}</div>` : '';
    };
    let config = { netlify: false, ipServidor: '' };
    fetch('/api/config').then((r) => r.json()).then((c) => { config = c; }).catch(() => {});

    let ultimaLista = [];
    async function carregar() {
      const lista = await api('/api/clones');
      ultimaLista = lista;
      $('#titulo-lista').textContent = `Páginas clonadas (${lista.length})`;
      if (!lista.length) {
        $('#lista').innerHTML = '<div class="vazio" style="grid-column:1/-1">Ainda não clonaste nenhuma página. Cola um link em cima.</div>';
        return;
      }
      $('#lista').innerHTML = lista.map((c) => `
        <div class="clone">
          <a class="thumb" href="/p/${c.id}/" target="_blank" style="background-image:url('/p/${c.id}/thumb.jpg')"></a>
          <div class="corpo">
            <div class="titulo">${esc(c.titulo)}</div>
            <div class="origem" title="${esc(c.url)}">${esc(new URL(c.url).hostname)} · ${c.formato === 'computador' ? '💻' : '📱'} · ${c.modo === 'estatica' ? '📷' : '✨'} · ${tamanho(c.bytes)}</div>
            ${publicadoEm(c)}
            <div class="accoes">
              <a class="btn" href="${urlPublica(c)}" target="_blank">Abrir</a>
              <button data-links="${c.id}">Links${(c.substituicoes || []).length ? ` (${c.substituicoes.length})` : ''}</button>
              <button data-pixels="${c.id}">Pixels${(c.meusPixels || []).length ? ` (${c.meusPixels.length})` : ''}</button>
              <button class="principal" data-publicar="${c.id}">Publicar</button>
              <button data-copiar="${c.id}">Copiar link</button>
              <a class="btn" href="/api/clones/${c.id}/zip">ZIP</a>
              <button class="perigo" data-apagar="${c.id}">Apagar</button>
            </div>
          </div>
        </div>`).join('');
    }

    $('#form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const botao = $('#botao');
      botao.disabled = true;
      const inicio = Date.now();
      mostrar('<span class="giro"></span> A abrir a página e a copiar tudo… (pode levar até 1 minuto)');
      try {
        const c = await api('/api/clones', {
          method: 'POST',
          body: JSON.stringify({
            url: $('#url').value.trim(),
            formato: document.querySelector('input[name=formato]:checked').value,
            modo: document.querySelector('input[name=modo]:checked').value,
            removerPopups: $('#popups').checked,
          }),
        });
        const extra = [
          c.pixelsOriginais?.length ? `${c.pixelsOriginais.length} pixels deles removidos` : '',
          c.removidos?.antiClone ? `${c.removidos.antiClone} script anti-clone removido` : '',
        ].filter(Boolean).join(' · ');
        mostrar(`✓ Clonada em ${Math.round((Date.now() - inicio) / 1000)}s — ${c.ficheiros} ficheiros${extra ? ' · ' + extra : ''}. <a href="/p/${c.id}/" target="_blank">Abrir</a>${c.aviso ? `<br><span class="px-aviso">${esc(c.aviso)}</span>` : ''}`, 'ok');
        $('#url').value = '';
        carregar();
      } catch (err) {
        mostrar(esc(err.message), 'erro');
      } finally {
        botao.disabled = false;
      }
    });

    $('#lista').addEventListener('click', async (e) => {
      const apagar = e.target.closest('[data-apagar]');
      const copiar = e.target.closest('[data-copiar]');
      if (apagar && confirm('Apagar esta página clonada? O link deixa de funcionar.')) {
        await api('/api/clones/' + apagar.dataset.apagar, { method: 'DELETE' });
        carregar();
      }
      if (copiar) {
        const c = (ultimaLista || []).find((x) => x.id === copiar.dataset.copiar);
        const link = c ? urlPublica(c) : `${location.origin}/p/${copiar.dataset.copiar}/`;
        try { await navigator.clipboard.writeText(link); copiar.textContent = 'Copiado ✓'; }
        catch { prompt('Copia o link:', link); }
        setTimeout(() => { copiar.textContent = 'Copiar link'; }, 1500);
      }
    });

    // ── Pixels
    const NOMES = {
      meta: 'Meta', tiktok: 'TikTok', google: 'Google', gtm: 'Tag Manager', kwai: 'Kwai',
      pinterest: 'Pinterest', snapchat: 'Snapchat', utmify: 'Utmify', clarity: 'Clarity', personalizado: 'Personalizado',
    };
    const dlg = $('#dlg-pixels');
    let atual = null;

    function pxEstado(msg, tipo = '') {
      $('#px-estado').className = 'estado ' + tipo;
      $('#px-estado').textContent = msg;
    }

    function desenharPixels() {
      $('#px-titulo').textContent = atual.titulo;
      const orig = atual.pixelsOriginais || [];
      $('#px-originais').innerHTML = orig.length ? orig.map((p) => `
        <div class="px-linha">
          <span class="px-tag">${NOMES[p.plataforma] || p.plataforma}</span>
          <code>${esc(p.id)}</code>
          ${p.estado === 'removido' ? '<span class="px-ok">removido ✓</span>'
            : p.estado === 'via-gtm' ? '<span class="px-aviso" title="Não está escrito na página — é carregado pelo Tag Manager. Remove o GTM.">vem pelo GTM</span>'
            : `<button class="perigo" data-remover-orig="${esc(p.id)}">Remover</button>`}
        </div>`).join('')
        : '<div class="px-vazio">Nenhum pixel encontrado.</div>';

      const meus = atual.meusPixels || [];
      $('#px-meus').innerHTML = meus.length ? meus.map((p, i) => `
        <div class="px-linha">
          <span class="px-tag meu">${NOMES[p.plataforma]}</span>
          <code>${esc(p.plataforma === 'personalizado' ? (p.codigo.slice(0, 40) + (p.codigo.length > 40 ? '…' : '')) : p.id)}</code>
          <button class="perigo" data-tirar-meu="${i}">Tirar</button>
        </div>`).join('')
        : '<div class="px-vazio">Ainda não adicionaste nenhum. Entram na página publicada e no ZIP.</div>';
    }

    async function guardarMeus(lista) {
      atual = await api(`/api/clones/${atual.id}/pixels`, { method: 'PUT', body: JSON.stringify({ meusPixels: lista }) });
      desenharPixels();
      carregar();
    }

    $('#px-plataforma').addEventListener('change', () => {
      const perso = $('#px-plataforma').value === 'personalizado';
      $('#px-id').hidden = perso;
      $('#px-codigo').hidden = !perso;
    });

    $('#px-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const plataforma = $('#px-plataforma').value;
      const novo = plataforma === 'personalizado'
        ? { plataforma, codigo: $('#px-codigo').value }
        : { plataforma, id: $('#px-id').value.trim() };
      try {
        await guardarMeus([...(atual.meusPixels || []), novo]);
        $('#px-id').value = ''; $('#px-codigo').value = '';
        pxEstado('✓ Pixel adicionado — já está na página publicada.', 'ok');
      } catch (err) { pxEstado(err.message, 'erro'); }
    });

    dlg.addEventListener('click', async (e) => {
      if (e.target === dlg || e.target.closest('[data-fechar]')) return dlg.close();
      const tirar = e.target.closest('[data-tirar-meu]');
      const remover = e.target.closest('[data-remover-orig]');
      try {
        if (tirar) {
          const lista = [...atual.meusPixels];
          lista.splice(Number(tirar.dataset.tirarMeu), 1);
          await guardarMeus(lista);
          pxEstado('Pixel tirado.', 'ok');
        }
        if (remover) {
          const r = await api(`/api/clones/${atual.id}/pixels/remover`, { method: 'POST', body: JSON.stringify({ id: remover.dataset.removerOrig }) });
          atual = r.meta;
          desenharPixels();
          pxEstado(r.removidos ? `✓ Removido (${r.removidos} bloco${r.removidos > 1 ? 's' : ''} de código).` : 'Não está escrito na página — vem pelo Tag Manager. Remove o GTM.', r.removidos ? 'ok' : 'erro');
        }
      } catch (err) { pxEstado(err.message, 'erro'); }
    });

    $('#lista').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-pixels]');
      if (!b) return;
      const lista = await api('/api/clones');
      atual = lista.find((c) => c.id === b.dataset.pixels);
      if (!atual) return;
      pxEstado('');
      desenharPixels();
      dlg.showModal();
    });

    // ── Links
    const dlgLinks = $('#dlg-links');
    let links = [];
    let paginaLinks = null;
    const TIPO = { checkout: '💳', whatsapp: '💬', link: '🔗' };

    function lnEstado(msg, tipo = '') { $('#ln-estado').className = 'estado ' + tipo; $('#ln-estado').textContent = msg; }

    function desenharLinks() {
      if (!links.length) {
        $('#ln-lista').innerHTML = '<div class="px-vazio">Não encontrei botões de compra nem checkouts nesta página.</div>';
        return;
      }
      $('#ln-lista').innerHTML = links.map((l, i) => `
        <div class="ln-item ${l.tipo}">
          <div class="ln-cab">
            <span class="px-tag">${TIPO[l.tipo]} ${esc(l.plataforma)}</span>
            <span class="ln-textos">${l.textos.map((t) => `“${esc(t)}”`).join(' ')}${l.ocorrencias > 1 ? ` · ${l.ocorrencias}×` : ''}</span>
          </div>
          <a class="ln-url" href="${esc(l.url)}" target="_blank" rel="noreferrer" title="${esc(l.url)}">${esc(l.url)}</a>
          <input data-i="${i}" class="ln-novo" placeholder="Novo link (vazio = fica o original)" value="${esc(l.novo || '')}" autocomplete="off">
        </div>`).join('');
    }

    $('#lista').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-links]');
      if (!b) return;
      paginaLinks = ultimaLista.find((c) => c.id === b.dataset.links);
      $('#ln-titulo').textContent = paginaLinks?.titulo || '';
      lnEstado('A procurar links…');
      $('#ln-lista').innerHTML = '';
      dlgLinks.showModal();
      try {
        links = await api(`/api/clones/${b.dataset.links}/links`);
        lnEstado(`${links.filter((l) => l.tipo === 'checkout').length} checkouts · ${links.filter((l) => l.tipo === 'whatsapp').length} WhatsApp · ${links.filter((l) => l.tipo === 'link').length} outros botões`);
        desenharLinks();
      } catch (err) { lnEstado(err.message, 'erro'); }
    });

    $('#ln-lista').addEventListener('input', (e) => {
      if (e.target.matches('.ln-novo')) links[e.target.dataset.i].novo = e.target.value.trim();
    });

    $('#ln-aplicar-todos').addEventListener('click', () => {
      const v = $('#ln-todos').value.trim();
      if (!v) return lnEstado('Cola primeiro o teu link.', 'erro');
      let n = 0;
      links.forEach((l) => { if (l.tipo !== 'link' || l.botao) { l.novo = v; n++; } });
      desenharLinks();
      lnEstado(`Aplicado a ${n} links — carrega em “Guardar links”.`, 'ok');
    });

    $('#ln-wa-gerar').addEventListener('click', async () => {
      try {
        const r = await api(`/api/whatsapp?numero=${encodeURIComponent($('#ln-wa-numero').value)}&mensagem=${encodeURIComponent($('#ln-wa-msg').value)}`);
        $('#ln-todos').value = r.link;
        lnEstado('Link de WhatsApp pronto — carrega em “Aplicar a todos” ou cola num link.', 'ok');
      } catch (err) { lnEstado(err.message, 'erro'); }
    });

    $('#ln-guardar').addEventListener('click', async () => {
      try {
        const substituicoes = links.filter((l) => l.novo).map((l) => ({ de: l.url, para: l.novo }));
        await api(`/api/clones/${paginaLinks.id}/links`, { method: 'PUT', body: JSON.stringify({ substituicoes }) });
        lnEstado(`✓ ${substituicoes.length} link${substituicoes.length === 1 ? '' : 's'} trocado${substituicoes.length === 1 ? '' : 's'} — já está na página publicada.`, 'ok');
        carregar();
      } catch (err) { lnEstado(err.message, 'erro'); }
    });

    // ── Publicar
    const dlgPub = $('#dlg-publicar');
    let paginaPub = null;
    function pbEstado(msg, tipo = '') { $('#pb-estado').className = 'estado ' + tipo; $('#pb-estado').textContent = msg; }

    function desenharPub() {
      const c = paginaPub;
      $('#pb-titulo').textContent = c.titulo;
      $('#pb-origem').textContent = location.host + '/';
      $('#pb-slug').value = c.slug || '';
      $('#pb-dominio').value = (c.dominios || []).join(', ');
      $('#pb-netlify').value = c.netlify?.nome || c.slug || '';
      $('#pb-ajuda-dominio').innerHTML = `No sítio onde compraste o domínio, cria um registo <b>A</b> a apontar para <code>${esc(config.ipServidor || 'o IP do servidor')}</code>.
        Depois o domínio tem de ser adicionado ao serviço do clonador no Easypanel (é aí que se liga o HTTPS).`;
      $('#pb-netlify-info').innerHTML = !config.netlify
        ? '⚠️ Ainda não ligado: falta pôr o <code>NETLIFY_TOKEN</code> no Easypanel.'
        : c.netlify?.url ? `Publicado em <a href="${esc(c.netlify.url)}" target="_blank">${esc(c.netlify.url)}</a> · carrega em Publicar de novo depois de mudares links ou pixels.`
        : 'Cria um site grátis com HTTPS em segundos.';
      $('#pb-netlify-publicar').disabled = !config.netlify;
    }

    $('#lista').addEventListener('click', (e) => {
      const b = e.target.closest('[data-publicar]');
      if (!b) return;
      paginaPub = ultimaLista.find((c) => c.id === b.dataset.publicar);
      if (!paginaPub) return;
      pbEstado('');
      desenharPub();
      dlgPub.showModal();
    });

    $('#pb-guardar').addEventListener('click', async () => {
      try {
        paginaPub = await api(`/api/clones/${paginaPub.id}/publicacao`, {
          method: 'PUT',
          body: JSON.stringify({ slug: $('#pb-slug').value, dominios: $('#pb-dominio').value.split(/[\s,]+/).filter(Boolean) }),
        });
        desenharPub();
        pbEstado(paginaPub.slug ? `✓ No ar em ${location.origin}/${paginaPub.slug}/` : '✓ Guardado.', 'ok');
        carregar();
      } catch (err) { pbEstado(err.message, 'erro'); }
    });

    $('#pb-netlify-publicar').addEventListener('click', async () => {
      const botao = $('#pb-netlify-publicar');
      botao.disabled = true;
      $('#pb-netlify-info').innerHTML = '<span class="giro"></span> A publicar na Netlify…';
      try {
        paginaPub = await api(`/api/clones/${paginaPub.id}/netlify`, { method: 'POST', body: JSON.stringify({ nome: $('#pb-netlify').value.trim().toLowerCase() }) });
        desenharPub();
        carregar();
      } catch (err) {
        $('#pb-netlify-info').innerHTML = `<span class="px-aviso">${esc(err.message)}</span>`;
      } finally {
        botao.disabled = !config.netlify;
      }
    });

    for (const d of [dlgLinks, dlgPub]) {
      d.addEventListener('click', (e) => { if (e.target === d || e.target.closest('[data-fechar]')) d.close(); });
    }

    $('#sair').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      location.href = '/login';
    });

    // Partilhar um link para o app no telemóvel já preenche o campo.
    const partilhado = new URLSearchParams(location.search).get('url') || new URLSearchParams(location.search).get('text');
    if (partilhado) $('#url').value = (partilhado.match(/https?:\/\/\S+/) || [partilhado])[0];

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
    carregar().catch((err) => mostrar(esc(err.message), 'erro'));
  </script>
</body>
</html>
